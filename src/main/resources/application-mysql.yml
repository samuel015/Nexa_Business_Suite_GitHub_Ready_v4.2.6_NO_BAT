spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/nexa_business?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:nexa}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
