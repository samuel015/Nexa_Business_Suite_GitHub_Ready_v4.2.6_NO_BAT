services:
  mysql:
    image: mysql:8.0
    container_name: nexa-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nexa_business}
      MYSQL_USER: ${DB_USERNAME:-nexa}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - nexa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  nexa_mysql_data:
